# @package _group_

# Legacy DPR single-positive NLL with gold passages from other questions used
# as in-batch negatives. Known multi-label positives are masked from the
# negative softmax denominator.
batch_size: 64
dev_batch_size: 128
adam_eps: 1e-8
adam_betas: (0.9, 0.999)
max_grad_norm: 1.0
log_batch_step: 20
train_rolling_loss_step: 100
weight_decay: 0.0
learning_rate: 2e-5
warmup_steps: 100
gradient_accumulation_steps: 1
keep_partial_batches: true
num_train_epochs: 10
eval_per_epoch: 1
hard_negatives: 0
other_negatives: 0
multi_positive: false
mask_multilabel_false_negatives: true
save_optimizer: true
keep_last_n: 2
val_av_rank_hard_neg: 0
val_av_rank_other_neg: 0
val_av_rank_bsz: 256
val_av_rank_max_qs: 10000
